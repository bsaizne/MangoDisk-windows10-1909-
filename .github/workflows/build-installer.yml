name: build-installer

# Builds an unsigned NSIS installer on a Windows runner with the MSVC toolchain.
# Trigger it manually from the Actions tab after pushing this branch to a fork.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        shell: pwsh
        run: |
          npm install -g pnpm@11.13.1 --no-fund --no-audit
          pnpm --version

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        shell: pwsh
        env:
          # The privileged helper is Authenticode-verified for official releases.
          # This local/CI build has no signing certificate, so verification is skipped
          # and the CPU-temperature capability stays unavailable at runtime.
          MANGODISK_ALLOW_UNSIGNED_PRIVILEGED: '1'
        run: pnpm tauri build --config tauri.ci.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MangoDisk-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
