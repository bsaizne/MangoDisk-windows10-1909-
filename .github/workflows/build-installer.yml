name: build-installer

# Builds an unsigned NSIS installer on a Windows runner with the MSVC toolchain.
# Trigger it manually from the Actions tab after pushing this branch to a fork.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        shell: pwsh
        run: |
          npm install -g pnpm@11.13.1 --no-fund --no-audit
          pnpm --version

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        shell: pwsh
        env:
          # The privileged helper is Authenticode-verified for official releases.
          # This local/CI build has no signing certificate, so verification is skipped
          # and the CPU-temperature capability stays unavailable at runtime.
          MANGODISK_ALLOW_UNSIGNED_PRIVILEGED: '1'
        run: pnpm tauri build --config tauri.ci.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MangoDisk-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Read product version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "local-v${{ steps.version.outputs.version }}"
          $asset = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          if (-not $asset) { throw "no installer found" }
          $notes = @"
          Unsigned local build of MangoDisk ${{ steps.version.outputs.version }}.

          - Commit: ${{ github.sha }}
          - Workflow run: ${{ github.run_id }}
          - The privileged CPU-temperature helper is unsigned and is rejected at runtime on purpose; every other feature works normally.
          "@
          gh release view $tag --json tagName 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists, replacing asset"
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title "MangoDisk ${{ steps.version.outputs.version }} (local build)" --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "release publish failed" }
          gh release view $tag --json url --jq .url
